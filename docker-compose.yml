services:
    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.0.2
        container_name: noad-elasticsearch
        environment:
            - discovery.type=single-node
            - xpack.security.enabled=false
            - ES_JAVA_OPTS=-Xms1g -Xmx1g
        ports:
            - "9200:9200"
        volumes:
            - noad_es_data:/usr/share/elasticsearch/data

volumes:
    noad_es_data:
